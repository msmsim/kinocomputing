<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kino Computing</title>
  <meta name="description" content="Kino Computing">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --fg: #1a1a1a;
      --muted: #666666;
      --rule: #e3e3e3;
      --link: #2c5fd6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214;
        --fg: #eceded;
        --muted: #9a9c9f;
        --rule: #2a2c30;
        --link: #7ea6ff;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 4rem 1.5rem;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      max-width: 40rem;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 .25rem;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
    }

    .tagline {
      margin: 0 0 2rem;
      color: var(--muted);
    }

    hr {
      border: 0;
      border-top: 1px solid var(--rule);
      margin: 2rem 0;
    }

    a {
      color: var(--link);
    }

    footer {
      margin-top: 3rem;
      color: var(--muted);
      font-size: .875rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Kino Computing</h1>
    <p class="tagline">Coming soon.</p>

    <hr>

    <p>
      Placeholder page. Replace this copy with whatever the site is actually about.
    </p>

    <p>
      Contact: <a href="mailto:matt@msweet.net">matt@msweet.net</a>
    </p>

    <footer>
      &copy; <span id="year">2026</span> Kino Computing
    </footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
