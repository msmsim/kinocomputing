<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base target="_blank">
    <title>{{slug}} | Kinocomputing</title>
    <meta name="description" content="{{description}}">
    <meta property="og:title" content="{{slug}}">
    <meta property="og:description" content="{{description}}">
    <meta property="og:url" content="{{url}}">
    <meta property="og:type" content="article">
    <meta property="og:site_name" content="Kinocomputing">
    <meta property="article:published_time" content="{{datetime_iso}}">
    <meta name="twitter:card" content="summary">
    <link rel="canonical" href="{{url}}">
    <link rel="stylesheet" href="/note.css">
    <!-- if:pin --><meta name="blyg:pin" content="{{pin}}"><!-- /if:pin -->
    <!-- if:change_note --><meta name="blyg:note" content="{{change_note}}"><!-- /if:change_note -->
</head>
<body>
<main>
{{content}}
</main>
<footer class="notefoot">
<!-- if:stamp -->
<p class="stamp"><a href="{{path}}" target="_self"><time datetime="{{datetime_iso}}">{{datetime}}</time></a></p>
<!-- /if:stamp -->
<nav class="adjacent">
<!-- if:home -->
<a rel="home" href="{{index_path}}" target="_self">↑ Home</a>
<!-- /if:home -->
<!-- if:prev -->
<a rel="prev" href="{{prev_path}}" target="_self">← Previous</a>
<!-- /if:prev -->
<!-- if:next -->
<a rel="next" href="{{next_path}}" target="_self">→ Next</a>
<!-- /if:next -->
</nav>
</footer>
</body>
</html>
